# Défauts communs Joutio (namespace applicatif), importés par les services via
# `spring.config.import: optional:classpath:joutio-defaults.yml`.
#
# Priorité : un fichier importé est **moins prioritaire** que le fichier qui l'importe
# et que les variables d'environnement. Chaque service peut donc surcharger ces valeurs.
#
# ⚠️ Ne pas y mettre de secret ni de valeur spécifique à un service.

spring:
  flyway:
    # Chaque service reste propriétaire de ses migrations (locations surchargées
    # dans son application.yml) ; ces réglages sont communs à tous les services.
    validate-on-migrate: true
    out-of-order: false
    fail-on-missing-locations: true
    clean-disabled: true
    baseline-on-migrate: false

logging:
  level:
    com.joutio: ${JOUTIO_LOG_LEVEL:INFO}
    org.apache.kafka: OFF
    org.springframework.kafka: OFF
