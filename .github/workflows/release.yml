name: Release
on:
  push:
    branches: [main]
jobs:
  release:
    uses: joutio/joutio-reusable-workflows/.github/workflows/lib-release.yml@main
    with:
      java-version: "25"
      github-username: ${{ vars.JOUTIO_GITHUB_USERNAME }}
    secrets:
      GITHUB_PASSWORD: ${{ secrets.JOUTIO_GITHUB_TOKEN }}

